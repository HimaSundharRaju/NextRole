name: Deploy

# Deploys main to Cloudflare after CI passes on it, or on demand from the Actions tab.
# Until the secrets and variables in docs/DEPLOY_CLOUDFLARE.md are set, automatic runs skip.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    # Only CI runs for pushes to this repository's main branch can deploy; a pull request
    # (including one from a fork whose branch is named "main") never can.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      # Repository secrets
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SMTP_URL: ${{ secrets.SMTP_URL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      # Repository variables
      APP_URL: ${{ vars.APP_URL }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      AI_MODEL: ${{ vars.AI_MODEL }}
      ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check configuration
        id: config
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID APP_URL DATABASE_URL REDIS_URL \
                      BETTER_AUTH_SECRET ENCRYPTION_KEY ANTHROPIC_API_KEY SMTP_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error title=Missing configuration::Set these GitHub secrets/variables first:$missing (see docs/DEPLOY_CLOUDFLARE.md)"
            exit 1
          else
            echo "::notice title=Deploy skipped::Cloudflare deployment is not configured yet. Missing:$missing (see docs/DEPLOY_CLOUDFLARE.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.config.outputs.ready == 'true'
        with:
          # Deploy exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.config.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.config.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        if: steps.config.outputs.ready == 'true'
        run: pnpm db:migrate
      - name: Add missing default job boards
        if: steps.config.outputs.ready == 'true'
        run: pnpm db:seed

      - name: Deploy Worker and containers
        if: steps.config.outputs.ready == 'true'
        working-directory: apps/edge
        run: |
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          node -e '
            const [file, ...keys] = process.argv.slice(1);
            const values = Object.fromEntries(keys.filter((k) => process.env[k]).map((k) => [k, process.env[k]]));
            require("node:fs").writeFileSync(file, JSON.stringify(values), { mode: 0o600 });
          ' "$secrets_file" APP_URL DATABASE_URL REDIS_URL BETTER_AUTH_SECRET ENCRYPTION_KEY \
            ANTHROPIC_API_KEY SMTP_URL GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET EMAIL_FROM AI_MODEL \
            ANTHROPIC_BASE_URL
          pnpm exec wrangler deploy --secrets-file "$secrets_file"
          rm -f "$secrets_file"

      - name: Smoke test
        if: steps.config.outputs.ready == 'true'
        run: |
          # The first request after a deploy starts a container, which can take a minute.
          for attempt in $(seq 1 20); do
            status=$(curl -s -o health.json -w '%{http_code}' --max-time 60 "$APP_URL/api/health" || true)
            if [ "$status" = "200" ]; then
              echo "Healthy: $(cat health.json)"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $status"
            sleep 15
          done
          echo "::error title=Smoke test failed::$APP_URL/api/health did not return 200: $(cat health.json 2>/dev/null)"
          exit 1
